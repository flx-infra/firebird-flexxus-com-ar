version: "3.9"

services:
  firebird:
    image: jacobalberty/firebird:2.5-sc
    environment:
      - ISC_PASSWORD=3122414422
      - TZ=America/Argentina/Cordoba
    volumes:
      - firebird_data:/firebird/data   
    networks:
      - traefik
    deploy:
      placement:
        constraints: ["${NODE}"]  
    ports:
      - "3050:3050"
    restart: unless-stopped
    logging:
      driver: loki
      options:
        loki-url: ${LOKI_URL}  

  sftp:
    image: atmoz/sftp
    volumes:
      - firebird_data:/home/sftp-user/firebird-data  
    ports:
      - "2222:22"
    command: "sftp-user:admin:1001:0:firebird-data"
    deploy:
      placement:
        constraints: ["${NODE}"]      
    restart: unless-stopped
    
  filebrowser:
    image: hurlenko/filebrowser:v2.10.0
    user: "0:0"
    ports:
      - "8022:8080"
    volumes:
      - firebird_data:/firebird/data
    deploy:
      placement:
        constraints: ["${NODE}"]
    environment:
      - FB_PASSWORD=$$2a$$10$$v174TC2HFsPfoEXMkXlrH.wpmUzGsUPpnSf.xOUp1IK1s4tndTKFy
      - FB_BASEURL=/filebrowser/
    restart: always
    networks:
      - traefik  
      
volumes:
  firebird_data:
    driver: local
    name: "${SERVICE_NAME}_firebird_data"
networks:
  traefik:
    external:
      name: traefik-network
